<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="calculator-card">
        <div class="display-area">
          <p class="label">FastAPI Calculator</p>
          <div class="expression" data-expression>0</div>
          <div class="result" data-display>0</div>
        </div>

        <div class="button-grid">
          <button class="action-btn" data-action="clear">C</button>
          <button class="action-btn" data-action="backspace">⌫</button>
          <button class="action-btn" data-value="(">(</button>
          <button class="action-btn" data-value=")">)</button>

          <button class="digit-btn" data-value="7">7</button>
          <button class="digit-btn" data-value="8">8</button>
          <button class="digit-btn" data-value="9">9</button>
          <button class="operator-btn" data-value="/">÷</button>

          <button class="digit-btn" data-value="4">4</button>
          <button class="digit-btn" data-value="5">5</button>
          <button class="digit-btn" data-value="6">6</button>
          <button class="operator-btn" data-value="*">×</button>

          <button class="digit-btn" data-value="1">1</button>
          <button class="digit-btn" data-value="2">2</button>
          <button class="digit-btn" data-value="3">3</button>
          <button class="operator-btn" data-value="-">−</button>

          <button class="digit-btn" data-value="0">0</button>
          <button class="digit-btn" data-value=".">.</button>
          <button class="equals-btn" data-action="equals">=</button>
          <button class="operator-btn" data-value="+">+</button>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
